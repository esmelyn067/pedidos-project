version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: pedidosdb
      POSTGRES_USER: pedidos_user
      POSTGRES_PASSWORD: pedidos_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8081:8080"

volumes:
  pgdata:
